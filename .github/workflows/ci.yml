name: BankOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  BANKOPS_AGENT_LLM_PROVIDER: disabled
  BANKOPS_AGENT_REMEDIATION_ENABLED: 'false'
  LANGSMITH_TRACING: 'false'

jobs:
  backend:
    name: Java 21 banking and database authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bankops_test
          POSTGRES_DB: bankops_test
          # Disposable runner-only credential; no repository/development secrets.
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U bankops_test -d bankops_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/banking-service/pom.xml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select disposable PostgreSQL only
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: python .github/scripts/database_env.py
      - name: Banking regressions including dedicated Flyway identity and ACL probes
        working-directory: backend/banking-service
        run: bash mvnw --batch-mode --no-transfer-progress test
      - name: Failure summary (no raw SQL, credentials or report artifacts)
        if: failure()
        run: python .github/scripts/test_summary.py backend/banking-service/target/surefire-reports

  agent:
    name: Python 3.12 reliability agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent/requirements.lock
            agent/requirements-test.lock
            agent/pyproject.toml
      - name: Install locked agent dependencies
        run: |
          python -m pip install pip==26.2.2 setuptools==84.2.1
          python -m pip install -r agent/requirements-test.lock
          python -m pip install --no-deps --no-build-isolation -e agent
          python -m pip check
      - name: Agent regressions (mocked inference, no cloud keys)
        working-directory: agent
        run: python -m pytest -q -W error

  airflow-database:
    name: Airflow 3.3.2 reconciliation and PostgreSQL security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bankops_test
          POSTGRES_DB: bankops_test
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U bankops_test -d bankops_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select disposable PostgreSQL only
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: python .github/scripts/database_env.py
      - name: Build existing patched Airflow test image
        run: docker build --file airflow/Dockerfile.test --tag bankops-ci-airflow airflow
      - name: Reconciliation, DAG, provisioning and SCRAM regressions
        run: |
          docker run --rm --network host \
            --env BANKOPS_RECONCILIATION_TEST_DSN \
            --env BANKOPS_DATABASE_SECURITY_TEST_DSN \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace/airflow \
            --env AIRFLOW__CORE__LOAD_EXAMPLES=False \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace bankops-ci-airflow \
            python -m pytest -q -W error -p no:cacheprovider \
            airflow/tests database/tests database/integration

  frontend:
    name: React, TypeScript and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install locked Playwright Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Chromium desktop and mobile regressions
        run: npm run test:e2e -- --config playwright.config.ts --reporter=line
      - name: Local launcher, security harness and CI safety checks
        working-directory: .
        run: |
          python -m pip install pytest==8.4.2 PyYAML==6.0.3
          python -m pytest -q -W error local/tests security/tests .github/tests
