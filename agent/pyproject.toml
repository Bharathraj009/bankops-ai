[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bankops-reliability-agent"
version = "0.1.0"
description = "Independent BankOps AI reliability agent foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2026.10.19",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "httpx2>=2,<3",
    "langgraph>=1,<2",
    "langsmith>=0.14,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bankops-agent = "bankops_agent.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bankops_agent.rag" = ["corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
