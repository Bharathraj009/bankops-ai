services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bankops
      POSTGRES_USER: bankops
      POSTGRES_PASSWORD: ${BANKOPS_POSTGRES_ADMIN_PASSWORD:?Set BANKOPS_POSTGRES_ADMIN_PASSWORD for infrastructure administration, never the runtime password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "hba_file=/etc/postgresql/bankops-pg_hba.conf"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bankops_postgres_data:/var/lib/postgresql/data
      - ./database/pg_hba.conf:/etc/postgresql/bankops-pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankops -d bankops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.15.0
    networks: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bankops_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.4
    networks: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${BANKOPS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${BANKOPS_GRAFANA_ADMIN_PASSWORD:?Set BANKOPS_GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bankops_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    networks: [monitoring]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

networks:
  monitoring:

volumes:
  bankops_postgres_data:
  bankops_prometheus_data:
  bankops_grafana_data:
