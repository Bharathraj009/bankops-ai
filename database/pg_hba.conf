# Banking cluster only. Administrator is infrastructure-only; app/readers may
# authenticate only to bankops, never postgres/template/other databases.
# Authentication is SCRAM even on container-local sockets. No trust fallback.
local all bankops scram-sha-256
local bankops bankops_migrator,bankops_runtime,bankops_reconciliation scram-sha-256
local all all reject
host all bankops 0.0.0.0/0 scram-sha-256
host all bankops ::/0 scram-sha-256
host bankops bankops_migrator,bankops_runtime,bankops_reconciliation 0.0.0.0/0 scram-sha-256
host bankops bankops_migrator,bankops_runtime,bankops_reconciliation ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
